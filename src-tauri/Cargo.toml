[package]
name = "halabi-online-admin"
version = "0.1.0"
description = "Halabi Online administration desktop application"
edition = "2021"
rust-version = "1.77"

[lib]
name = "halabi_online_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The JWT is held in the operating system's credential store (macOS Keychain,
# Windows Credential Manager, Linux Secret Service) rather than in localStorage.
# See src/keychain.rs for why.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
