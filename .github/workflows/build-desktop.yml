name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows (.msi) and Linux (.deb) builds are disabled for now — macOS is
    # the only platform in active use. Re-add a matrix with those entries
    # (see git history) when they're needed again.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Surfaces Rust/JS toolchain and Tauri package versions in the log
      # before the build runs, so a mismatch (crate vs. NPM package minor
      # version, outdated plugin, etc.) is visible immediately instead of
      # only showing up as an opaque "exited with code 1" further down.
      - name: Show Tauri environment info
        run: bun run tauri info

      # A plain push to main has no signing keys and isn't releasing anything —
      # it only needs to prove the app still builds, so it skips updater
      # signing and just uploads the installer as an Action artifact.
      - name: Build installer (CI check)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: bun run tauri build --ci --bundles dmg

      - uses: actions/upload-artifact@v7
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: halabi-admin-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

      # A version tag (v0.1.0, v0.2.1, …) builds a *signed* update artifact
      # alongside the installer, creates/updates the GitHub Release for this
      # tag, and uploads a `latest.json` that the in-app updater polls.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Halabi Online Admin ${{ github.ref_name }}'
          generateReleaseNotes: true
          args: --bundles dmg
