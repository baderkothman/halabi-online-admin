name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: halabi-admin-macos
            release-glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: msi
            artifact: halabi-admin-windows
            release-glob: src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            bundle: deb
            artifact: halabi-admin-linux
            release-glob: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bun run tauri build --ci --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      # Only a version tag (v0.1.0, v0.2.1, …) publishes a release; a plain
      # push to main still builds and uploads Action artifacts above, but
      # does not create or touch a release. Each OS in this matrix runs this
      # step for the same tag and release — softprops/action-gh-release
      # creates the release on the first upload and appends assets on the
      # rest, so three parallel jobs converge on one release with all three
      # installers rather than three separate releases.
      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Halabi Online Admin ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ matrix.release-glob }}
