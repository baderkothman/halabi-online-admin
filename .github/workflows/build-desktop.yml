name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: halabi-admin-macos
            release-glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle: msi
            artifact: halabi-admin-windows
            release-glob: src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            bundle: deb
            artifact: halabi-admin-linux
            release-glob: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # A plain push to main has no signing keys and isn't releasing anything —
      # it only needs to prove the app still builds, so it skips updater
      # signing and just uploads the installer as an Action artifact.
      - name: Build installer (CI check)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: bun run tauri build --ci --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

      # A version tag (v0.1.0, v0.2.1, …) builds a *signed* update artifact
      # alongside the installer, creates/updates the GitHub Release for this
      # tag, and uploads a merged `latest.json` that the in-app updater polls.
      # Each OS in this matrix runs this step for the same tag — tauri-action
      # converges all three onto one release, same as the manual upload below
      # used to, but also assembles latest.json across all three platforms.
      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Halabi Online Admin ${{ github.ref_name }}'
          generateReleaseNotes: true
          args: --bundles ${{ matrix.bundle }}
