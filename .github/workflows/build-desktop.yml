name: Build desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows (.msi) and Linux (.deb) builds are disabled for now — macOS is
    # the only platform in active use. Re-add a matrix with those entries
    # (see git history) when they're needed again.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Needs full tag history, not just the pushed commit, so the
          # version step below can see the latest existing release tag.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Surfaces Rust/JS toolchain and Tauri package versions in the log
      # before the build runs, so a mismatch (crate vs. NPM package minor
      # version, outdated plugin, etc.) is visible immediately instead of
      # only showing up as an opaque "exited with code 1" further down.
      - name: Show Tauri environment info
        run: bun run tauri info

      # Every push to main ships a release: bump the patch version, commit
      # it, and tag it. If the commit already carries a version ahead of the
      # latest tag — i.e. someone ran `bun run release <version>` locally for
      # a deliberate minor/major bump — that version is used as-is instead of
      # also auto-bumping it, so a manual bump and an automatic one can't
      # both land on the same push.
      - name: Determine and apply release version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          LATEST_TAG=${LATEST_TAG:-0.0.0}

          if [ "$CURRENT" != "$LATEST_TAG" ]; then
            NEW_VERSION="$CURRENT"
            echo "Releasing manually-bumped version $NEW_VERSION (latest tag was $LATEST_TAG)"
          else
            NEW_VERSION=$(node -e "
              const [maj, min, patch] = '$CURRENT'.split('.').map(Number);
              console.log(\`\${maj}.\${min}.\${patch + 1}\`);
            ")
            echo "Auto-bumping $CURRENT -> $NEW_VERSION"

            node -e "
              const fs = require('fs');
              for (const p of ['package.json', 'src-tauri/tauri.conf.json']) {
                const d = JSON.parse(fs.readFileSync(p, 'utf8'));
                d.version = '$NEW_VERSION';
                fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n');
              }
            "
            perl -0pi -e 's/(\[package\](?:(?!\n\[).)*?\nversion = ")[^"]+(")/${1}'"$NEW_VERSION"'${2}/s' src-tauri/Cargo.toml
            cargo check --quiet --manifest-path src-tauri/Cargo.toml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            git push origin HEAD:main
          fi

          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # Builds a *signed* update artifact alongside the installer, creates
      # the GitHub Release for the tag from the step above, and uploads a
      # `latest.json` that the in-app updater polls.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: 'Halabi Online Admin ${{ steps.version.outputs.tag }}'
          generateReleaseNotes: true
          args: --bundles dmg
